services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: afisha
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U afisha -d afisha"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: afisha-local:latest
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в файле .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEED_CONFIRMED_EVENTS: ${SEED_CONFIRMED_EVENTS:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-0.15}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-0.60}
      AGENT_REQUEST_BUDGET_USD: ${AGENT_REQUEST_BUDGET_USD:-0.03}
      AGENT_SESSION_BUDGET_USD: ${AGENT_SESSION_BUDGET_USD:-0.25}
      AGENT_USER_DAILY_BUDGET_USD: ${AGENT_USER_DAILY_BUDGET_USD:-1}
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  bot:
    profiles: [telegram]
    image: afisha-local:latest
    pull_policy: never
    command:
      - sh
      - -ec
      - |
        : "$${BOT_TOKEN:?Заполните BOT_TOKEN в файле .env}"
        : "$${INTERNAL_API_TOKEN:?Заполните INTERNAL_API_TOKEN в файле .env}"
        exec python -m tg_bot.main
    environment:
      BACKEND_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_IDS: ${ADMIN_IDS:-[]}
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
